<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dime Coach</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d2f24b'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='%23141a00' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply a saved theme before the first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('practiceplan.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
